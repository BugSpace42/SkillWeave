<!-- templates/registration/logged_out.html -->
{% extends 'base.html' %}

{% block title %}Выход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Выход выполнен</h4>
            </div>
            <div class="card-body text-center">
                <p class="lead">Вы успешно вышли из системы.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">Войти снова</a>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">На главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
