<!-- templates/profiles/edit.html -->
{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Редактирование профиля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Редактирование профиля</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                        {% if user.profile and user.profile.pk %}
                            <a href="{% url 'profiles:detail' user.profile.pk %}" class="btn btn-outline-secondary">Отмена</a>
                        {% else %}
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">На главную</a>
                        {% endif %}
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
